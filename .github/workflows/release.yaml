on:
  push:
    # Pattern matched against refs/tags
    tags: ["v[0-9]+", "v[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

name: Release
jobs:
  test:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check tag version == pyproject.version
        run: |
          pip install toml-cli
          PROJECT_VERSION=$(toml get --toml-path pyproject.toml project.version)
          TAG=$(git describe HEAD --tags --abbrev=0)
          echo "TAG: $TAG"
          echo "PROJECT_VERSION: $PROJECT_VERSION"
          if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then exit 1; fi

  build:
    runs-on: ubuntu-latest
    needs:
      - test
      - check_version
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: release-pypi
      url: https://pypi.org/p/dataproduct-cli
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create a GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # mandatory for making GitHub Releases
      id-token: write # mandatory for sigstore
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog for version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip 'v' prefix
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 > release_notes.md
          cat release_notes.md
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes-file release_notes.md
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
