on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "specs/**"
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

name: CI
jobs:
  lint:
    name: "Linting & Formatting (fix with: uv run ruff check --fix && uv run ruff format)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Check linting
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -n0

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: dataproduct --help
        run: dataproduct --help
      - name: dataproduct --version
        run: dataproduct --version
      - name: dataproduct init
        run: dataproduct init new-dataproduct.odps.yaml
      - name: dataproduct lint (the file we just created)
        run: dataproduct lint new-dataproduct.odps.yaml
