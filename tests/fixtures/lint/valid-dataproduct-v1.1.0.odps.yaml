      question: What was total revenue last month?
      answer: Sum order_total over the previous calendar month.
  constraints:
    - constraint: Do not expose customer email addresses.

synonyms:
  - synonym: Sales Orders
    locale: en-US
    source: glossary

inputPorts:
  - id: raw-orders
    name: raw-orders

outputPorts:
  - id: orders
    name: orders
    description: Curated orders
    type: tables
    deprecated: false
    synonyms:
      - synonym: Bestellungen
        locale: de-DE
    context:
      instructions: Prefer this port over legacy-orders.
    sbom:
      - type: library
        tags: ['build']
  - name: legacy-orders
    deprecated: true

customProperties:
  - property: costCenter
    value: cc-4711
    vendor: acme
