apiVersion: v1.1.0
kind: DataProduct
id: 064c4630-8aad-4dc0-ba95-0f69940e6b18
status: active
name: Orders Data Product
version: v2.0.0
type: consumerAligned
deprecated: false

description:
  purpose: Curated orders for analytics
  limitations: None
  usage: Analytics and reporting

context:
